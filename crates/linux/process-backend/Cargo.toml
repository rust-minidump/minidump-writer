[package]
name = "process-backend"
version = "0.1.0"
description = "Providers helpers for reading process memory specialized for minidump-writer"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
postcard = ["dep:postcard"]
testing = []
unix_stream = []

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc.workspace = true
postcard = { version = "1.1.3", default-features = false, optional = true }
process-reader = { version = "0.1.0", path = "../../process-reader", features = ["serde"] }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
process-backend = { path = ".", features = ["postcard", "testing", "unix_stream"] }